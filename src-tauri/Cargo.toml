[package]
name = "watools"
version = "0.1.0"
description = "WATools - 开发者工具箱"
authors = ["you"]
edition = "2021"

[lib]
name = "watools_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "watools"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
jsonwebtoken = "9"
base64 = "0.22"
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
hex = "0.4"
url = "2"
percent-encoding = "2"
uuid = { version = "1", features = ["v4", "v7"] }
regex = "1"
cron = "0.12"
similar = "2"
reqwest = { version = "0.12", features = ["json", "blocking"] }
base32 = "0.5"
html-escape = "0.2"
pulldown-cmark = "0.10"
